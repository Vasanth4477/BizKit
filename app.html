<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BizKit India business software for invoices, customers, inventory, expenses and payments."><title>BizKit India</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="publicApp"></div><div id="authApp"></div><div id="businessApp"></div><div id="toast" class="toast"></div>
<script src="/app.js"></script><script>
const P=location.pathname;
const publicPaths=['/','/features','/pricing','/resources'];
function publicShell(active){return `<header class="topnav"><div class="container inner"><button class="brand" onclick="location.href='/'">BizKit<span>India</span></button><nav class="publicnav"><a href="/features">Features</a><a href="/pricing">Pricing</a><a href="/resources">Resources</a></nav><div class="actions"><button class="btn" onclick="location.href='/login'">Log in</button><button class="btn primary" onclick="location.href='/signup'">Start free</button></div></div></header>`}
function renderPublic(){let body='';if(P==='/features')body=`<section class="section"><div class="container"><div class="sectionHead"><div><span class="tag">Product</span><h2 style="margin-top:10px">Everything in one business workspace.</h2><p>Built around the actual flow of a small business.</p></div></div><div class="grid4">${[['Calculate','GST, margin, break-even and pricing tools.'],['Sell','Invoices, quotations, payment records and reminders.'],['Track','Customers, products, inventory, suppliers and expenses.'],['Understand','Reports, activity, outstanding money and cash movement.'],['Collect','Payment links through an optional Razorpay integration.'],['Automate','A backend ready for WhatsApp, email and future workflows.'],['Stay local','INR, GSTIN, HSN/SAC and India-first document flows.'],['Grow','Multi-user, multi-business and advanced GST are designed as the next layer.']].map(x=>`<div class="card"><div class="iconBox">✓</div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div></section>`;else if(P==='/pricing')body=`<section class="section"><div class="container"><div class="sectionHead"><div><span class="tag">Pricing</span><h2 style="margin-top:10px">Start free. Pay when the workflow is valuable.</h2><p>No feature theatre. The paid layer comes after the core product works.</p></div></div><div class="pricing"><div class="card plan"><span class="tag">Free</span><h3>Starter</h3><p>Public tools, account, basic customers/products, invoices, quotations and expenses.</p><div class="price">₹0</div><button class="btn primary" onclick="location.href='/signup'">Start free</button></div><div class="card plan featured"><span class="tag">Planned</span><h3>Pro</h3><p>Unlimited cloud history, payment links, richer reports, advanced exports and automation.</p><div class="price">Coming soon</div><button class="btn" onclick="location.href='/signup'">Join early access</button></div><div class="card plan"><h3>Business</h3><p>Team users, multiple businesses, advanced GST workflows and controls.</p><div class="price">Coming soon</div><button class="btn" onclick="location.href='/signup'">Join early access</button></div></div></div></section>`;else if(P==='/resources')body=`<section class="section"><div class="container"><div class="sectionHead"><div><span class="tag">Resources</span><h2 style="margin-top:10px">Business guides built around useful questions.</h2><p>More depth will live here as the product grows.</p></div></div><div class="grid4">${[['GST','Understand CGST, SGST and IGST.'],['Invoices','Create professional invoices and track payment.'],['Profit','Understand margin, markup and break-even.'],['Inventory','Track stock without living in a spreadsheet.']].map((x,i)=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p><button class="btn soft" onclick="location.href='/app/tools'">Open tools</button></div>`).join('')}</div></div></section>`;else body=`<section class="hero"><div class="container heroGrid"><div><span class="eyebrow">Built for Indian micro & small businesses</span><h1>Run your business. Not your spreadsheets.</h1><p>BizKit brings invoices, quotations, customers, products, inventory, expenses, payments and business tools into a calmer workspace.</p><div class="actions" style="margin-top:24px"><button class="btn primary" onclick="location.href='/signup'">Start free</button><button class="btn" onclick="location.href='/features'">See how it works</button></div><div class="muted" style="margin-top:14px;font-size:12px">Cloud database · Mobile-first · India-focused</div></div><div class="heroCard"><h3>One place for the work that matters</h3><p class="muted">Sales, stock, customers and cash flow without the spreadsheet maze.</p><div class="heroStats"><div class="mini"><small>Invoices</small><strong>Sales</strong></div><div class="mini"><small>Customers</small><strong>CRM</strong></div><div class="mini"><small>Products</small><strong>Stock</strong></div><div class="mini"><small>Payments</small><strong>Collect</strong></div></div><div class="notice" style="margin-top:16px">Create an account when you want your business data saved in the cloud.</div></div></div></section><section class="section"><div class="container"><div class="sectionHead"><div><h2>From quote to payment</h2><p>A business workflow, not a pile of calculators.</p></div></div><div class="grid4">${[['01','Create','Customers, products and quotations.'],['02','Sell','Turn accepted work into invoices.'],['03','Collect','Record payments or generate a payment link.'],['04','Understand','Reports show sales, expenses and outstanding money.']].map(x=>`<div class="card"><div class="iconBox">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></div></section>`;$('#publicApp').innerHTML=publicShell()+body+`<footer class="footer"><div class="container footerGrid"><div><button class="brand" onclick="location.href='/'">BizKit<span>India</span></button><p class="muted">Simple business software for India's micro and small businesses.</p></div><div><strong>Product</strong><a href="/features">Features</a><a href="/pricing">Pricing</a><a href="/resources">Resources</a></div><div><strong>App</strong><a href="/app">Dashboard</a><a href="/app/invoices">Invoices</a><a href="/app/products">Products</a></div><div><strong>Legal</strong><a href="#">Privacy</a><a href="#">Terms</a><a href="mailto:hello@example.com">Contact</a></div></div></footer>`}
function authPage(mode){const signup=mode==='signup';$('#authApp').innerHTML=publicShell()+`<div class="loginWrap"><div class="loginCard"><span class="tag">BizKit account</span><h1>${signup?'Create your workspace':'Welcome back'}</h1><p class="muted">${signup?'Start free and keep your business data in the cloud.':'Sign in to your saved business workspace.'}</p><form id="authForm" data-mode="${mode}"><div class="field" ${signup?'':'style="display:none"'}><label>Business name<input id="name" ${signup?'required':''}></label></div><div class="field"><label>Email<input id="email" type="email" required></label></div><div class="field"><label>Password<input id="password" type="password" minlength="6" required></label></div><div id="formError" class="dangerBox" hidden></div><button class="btn primary" style="width:100%;margin-top:12px">${signup?'Create account':'Log in'}</button></form><p class="muted" style="font-size:12px;margin-top:14px">${signup?'Already have an account?':'Need an account?'} <a href="/${signup?'login':'signup'}" style="color:var(--brand);font-weight:850">${signup?'Log in':'Start free'}</a></p></div></div>`;Biz.wireAuth()}
function sidebar(){return `<aside class="side"><button class="brand" style="padding:8px 10px 18px" onclick="location.href='/app'">BizKit<span>India</span></button><div class="sideSection">OVERVIEW</div><a href="/app" data-route="/app">⌂ <span>Dashboard</span></a><div class="sideSection">SALES</div><a href="/app/invoices" data-route="/app/invoices">▤ <span>Invoices</span></a><a href="/app/quotations" data-route="/app/quotations">⌁ <span>Quotations</span></a><a href="/app/payments" data-route="/app/payments">₹ <span>Payments</span></a><div class="sideSection">BUSINESS</div><a href="/app/customers" data-route="/app/customers">◉ <span>Customers</span></a><a href="/app/products" data-route="/app/products">□ <span>Products & Stock</span></a><a href="/app/purchases" data-route="/app/purchases">↓ <span>Purchases</span></a><a href="/app/expenses" data-route="/app/expenses">− <span>Expenses</span></a><div class="sideSection">INSIGHTS</div><a href="/app/reports" data-route="/app/reports">▥ <span>Reports</span></a><a href="/app/tools" data-route="/app/tools">✦ <span>Tools</span></a><div class="sideSection">SYSTEM</div><a href="/app/integrations" data-route="/app/integrations">⌘ <span>Integrations</span></a><a href="/app/settings" data-route="/app/settings">⚙ <span>Settings</span></a><div style="margin-top:24px;padding:10px;font-size:11px;color:var(--muted)">Signed in as<br><b data-user-name></b></div><button class="btn sm" style="width:100%" onclick="Biz.logout()">Log out</button></aside>`}
function topbar(){return `<div class="workspaceTop"><div class="search"><input id="globalSearch" placeholder="Search customers, invoices, products..." autocomplete="off"><div id="searchResults" class="searchResults"></div></div><div class="actions"><a href="/app/invoices/new" class="btn primary">+ New</a><button class="btn" onclick="Biz.logout()">Log out</button></div></div>`}
function mobile(){return `<nav class="mobileNav"><a href="/app">⌂<br>Home</a><a href="/app/invoices">₹<br>Sales</a><a href="/app/products">□<br>Stock</a><a href="/app/customers">◉<br>Customers</a><a href="/app/settings">⋯<br>More</a></nav>`}
function layout(content){$('#businessApp').innerHTML=`<div class="appShell">${sidebar()}<div class="workspace">${topbar()}<main class="main">${content}</main></div></div>${mobile()}`;Biz.initShell()}
function simpleFormPage(title,sub,form){layout(`<div class="breadcrumbs">BizKit / ${title}</div><div class="pageTitle"><div><h1>${title}</h1><p>${sub}</p></div></div>${form}`)}
function renderApp(){if(!Biz.requireAuth())return;let c='';if(P==='/app')c=`<div class="breadcrumbs">Home</div><div class="pageTitle"><div><h1>Dashboard</h1><p>Welcome back, <span data-user-name></span>. Here's what's happening in your business.</p></div><div class="actions"><a class="btn" href="/app/customers">+ Customer</a><a class="btn" href="/app/products">+ Product</a><a class="btn" href="/app/expenses">+ Expense</a><a class="btn primary" href="/app/invoices/new">+ Invoice</a></div></div><div class="statGrid"><div class="stat"><small>Paid sales</small><strong id="rev">₹0</strong></div><div class="stat"><small>Outstanding</small><strong id="outstanding">₹0</strong></div><div class="stat"><small>Expenses</small><strong id="expenses">₹0</strong></div><div class="stat"><small>Estimated profit</small><strong id="profit">₹0</strong></div><div class="stat"><small>Customers</small><strong id="customers">0</strong></div></div><div class="twoCol"><div class="card"><div class="sectionHead"><div><h2 style="font-size:18px">Sales overview</h2><p>Last six months</p></div></div><div class="chart" id="salesChart"></div></div><div class="card"><div class="sectionHead"><div><h2 style="font-size:18px">Recent activity</h2></div></div><div id="activity"></div></div></div><div class="threeCol"><div class="card"><h3>Low stock</h3><p><b id="lowStock">0</b> products need attention.</p><a class="btn soft" href="/app/products">View inventory</a></div><div class="card"><h3>Quick collect</h3><p>Generate a payment link when Razorpay is connected.</p><a class="btn soft" href="/app/integrations">Open integrations</a></div><div class="card"><h3>Business tools</h3><p>GST, profit, break-even and salary tools are always one click away.</p><a class="btn soft" href="/app/tools">Open tools</a></div></div>`;else if(P==='/app/customers' && !new URLSearchParams(location.search).has('id'))c=`<div class="pageTitle"><div><h1>Customers</h1><p>Customer profiles, invoice history and outstanding balances.</p></div><button class="btn primary" onclick="$('#customerModal').classList.add('show')">+ Customer</button></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>GSTIN</th><th></th></tr></thead><tbody id="customerRows"></tbody></table></div></div><div class="modal" id="customerModal"><div class="modalBox"><button class="close" onclick="$('#customerModal').classList.remove('show')">×</button><h3>New customer</h3><div class="formGrid"><div class="field"><label>Name<input id="c_name"></label></div><div class="field"><label>Phone<input id="c_phone"></label></div><div class="field"><label>Email<input id="c_email"></label></div><div class="field"><label>GSTIN<input id="c_gstin"></label></div><div class="full field"><label>Address<textarea id="c_address"></textarea></label></div><div class="full field"><label>Notes<textarea id="c_notes"></textarea></label></div></div><div class="actionsRow"><button class="btn primary" onclick="Biz.submitCustomer()">Save customer</button></div></div></div>`;else if(P==='/app/customers')c=`<div class="pageTitle"><div><h1 id="customerName">Customer</h1><p>Customer relationship and payment history.</p></div><a class="btn primary" href="/app/invoices/new">+ Invoice</a></div><div class="statGrid"><div class="stat"><small>Outstanding</small><strong id="customerOutstanding">₹0</strong></div><div class="stat"><small>Phone</small><strong id="customerPhone">-</strong></div><div class="stat"><small>Email</small><strong id="customerEmail">-</strong></div><div class="stat"><small>GSTIN</small><strong id="customerGstin">-</strong></div><div class="stat"><small>Address</small><strong id="customerAddress">-</strong></div></div><div class="twoCol"><div class="card"><h3>Invoices</h3><div class="tableWrap"><table class="table"><tr><th>Invoice</th><th>Date</th><th>Total</th><th>Status</th></tr><tbody id="customerInvoices"></tbody></table></div></div><div class="card"><h3>Payments</h3><div class="tableWrap"><table class="table"><tr><th>Date</th><th>Amount</th><th>Method</th><th>Ref</th></tr><tbody id="customerPayments"></tbody></table></div></div></div>`;else if(P==='/app/products'&&!new URLSearchParams(location.search).has('id'))c=`<div class="pageTitle"><div><h1>Products & Stock</h1><p>Pricing, GST, inventory and stock movement in one place.</p></div><button class="btn primary" onclick="$('#productModal').classList.add('show')">+ Product</button></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>GST</th><th>Status</th><th></th></tr></thead><tbody id="productRows"></tbody></table></div></div><div class="modal" id="productModal"><div class="modalBox"><button class="close" onclick="$('#productModal').classList.remove('show')">×</button><h3>New product</h3><div class="formGrid"><div class="field"><label>Name<input id="p_name"></label></div><div class="field"><label>SKU<input id="p_sku"></label></div><div class="field"><label>HSN/SAC<input id="p_hsn"></label></div><div class="field"><label>Unit<select id="p_unit"><option>pcs</option><option>kg</option><option>hour</option><option>service</option></select></label></div><div class="field"><label>Selling price<input id="p_price" type="number"></label></div><div class="field"><label>Purchase price<input id="p_purchase" type="number"></label></div><div class="field"><label>GST rate<input id="p_gst" type="number" value="18"></label></div><div class="field"><label>Opening stock<input id="p_stock" type="number" value="0"></label></div><div class="field"><label>Low-stock threshold<input id="p_low" type="number" value="5"></label></div><div class="field" style="display:flex;align-items:end"><label><input id="p_track" type="checkbox" checked> Track stock</label></div></div><div class="actionsRow"><button class="btn primary" onclick="Biz.submitProduct()">Save product</button></div></div></div>`;else if(P==='/app/products')c=`<div class="pageTitle"><div><h1 id="productName">Product</h1><p>Product profile and stock movement history.</p></div><a class="btn" href="/app/products">← Products</a></div><div class="statGrid"><div class="stat"><small>SKU</small><strong id="productSku">-</strong></div><div class="stat"><small>Stock</small><strong id="productStock">0</strong></div><div class="stat"><small>Selling price</small><strong id="productPrice">₹0</strong></div><div class="stat"><small>GST</small><strong id="productGst">0%</strong></div><div class="stat"><small>Status</small><strong>Active</strong></div></div><div class="card" style="margin-top:16px"><h3>Stock movement</h3><div class="tableWrap"><table class="table"><tr><th>Date</th><th>Qty</th><th>Type</th><th>Note</th></tr><tbody id="movements"></tbody></table></div></div>`;else if(P==='/app/invoices'&&!new URLSearchParams(location.search).has('id'))c=`<div class="pageTitle"><div><h1>Invoices</h1><p>Create, track and collect payment for sales.</p></div><a class="btn primary" href="/app/invoices/new">+ Invoice</a></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="invoiceRows"></tbody></table></div></div>`;else if(P==='/app/invoices'&&new URLSearchParams(location.search).has('id'))c=`<div class="pageTitle"><div><h1 id="invoiceTitle">Invoice</h1><p>Invoice details and payment history.</p></div><div class="actions"><button class="btn" onclick="Biz.openPrint()">Print / PDF</button><a class="btn" href="/app/payments">Record payment</a></div></div><div class="statGrid"><div class="stat"><small>Customer</small><strong id="invoiceCustomer">-</strong></div><div class="stat"><small>Date</small><strong id="invoiceDate">-</strong></div><div class="stat"><small>Due</small><strong id="invoiceDue">-</strong></div><div class="stat"><small>Status</small><strong id="invoiceStatus">-</strong></div><div class="stat"><small>Total</small><strong id="invoiceTotal">₹0</strong></div></div><div class="card printArea" style="margin-top:16px"><h3>Items</h3><div class="tableWrap"><table class="table"><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr><tbody id="invoiceItems"></tbody></table></div><div style="text-align:right;margin-top:14px;font-size:18px;font-weight:950">Total <span id="invoiceTotalBottom">₹0</span></div></div><div class="card" style="margin-top:16px"><h3>Payments</h3><div class="tableWrap"><table class="table"><tr><th>Date</th><th>Amount</th><th>Method</th><th>Reference</th></tr><tbody id="paymentRows"></tbody></table></div></div>`;else if(P==='/app/invoices/new')c=`<div class="pageTitle"><div><h1>New invoice</h1><p>Create a professional invoice from the workspace.</p></div></div><div class="card"><div class="formGrid"><div class="field"><label>Invoice number<input id="inv_no" value="INV-${new Date().getTime().toString().slice(-6)}"></label></div><div class="field"><label>Invoice date<input id="inv_date" type="date"></label></div><div class="field"><label>Due date<input id="inv_due" type="date"></label></div><div class="field"><label>Customer name<input id="inv_customer"></label></div><div class="field"><label>Customer phone<input id="inv_phone"></label></div><div class="field"><label>GST rate<input id="inv_gst" value="18" type="number"></label></div><div class="full field"><label>Customer address<textarea id="inv_address"></textarea></label></div><div class="field"><label>Discount<input id="inv_discount" value="0" type="number"></label></div><div class="full"><h3>Items</h3><div class="formGrid"><div class="field"><label>Description<input id="inv_item"></label></div><div class="field"><label>Amount<input id="inv_amount" type="number"></label></div></div><div class="actionsRow"><button class="btn" onclick="addInvItem()">+ Add item</button></div><div id="invItems" style="margin-top:14px"></div></div></div><div class="actionsRow"><button class="btn primary" onclick="saveNewInvoice()">Save invoice</button><a class="btn" href="/app/invoices">Cancel</a></div></div>`;else if(P==='/app/payments')c=`<div class="pageTitle"><div><h1>Payments</h1><p>Record money received and keep invoices in sync.</p></div><button class="btn primary" onclick="$('#paymentModal').classList.add('show')">+ Record payment</button></div><div class="card"><div class="tableWrap"><table class="table"><tr><th>Date</th><th>Customer</th><th>Invoice</th><th>Amount</th><th>Method</th><th>Reference</th></tr><tbody id="paymentRowsMain"></tbody></table></div></div><div class="modal" id="paymentModal"><div class="modalBox"><button class="close" onclick="$('#paymentModal').classList.remove('show')">×</button><h3>Record payment</h3><div class="formGrid"><div class="field"><label>Invoice ID (optional)<input id="pay_invoice"></label></div><div class="field"><label>Customer ID (optional)<input id="pay_customer"></label></div><div class="field"><label>Amount<input id="pay_amount" type="number"></label></div><div class="field"><label>Method<select id="pay_method"><option>UPI</option><option>Bank transfer</option><option>Cash</option><option>Card</option><option>Cheque</option><option>Other</option></select></label></div><div class="field"><label>Reference<input id="pay_ref"></label></div><div class="field"><label>Date<input id="pay_date" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div><div class="full field"><label>Note<textarea id="pay_note"></textarea></label></div></div><div class="actionsRow"><button class="btn primary" onclick="Biz.submitPayment()">Save payment</button></div></div></div>`;else if(P==='/app/expenses')c=`<div class="pageTitle"><div><h1>Expenses</h1><p>Track business costs and see their impact on profit.</p></div><button class="btn primary" onclick="$('#expenseModal').classList.add('show')">+ Expense</button></div><div class="card"><div class="tableWrap"><table class="table"><tr><th>Date</th><th>Category</th><th>Amount</th><th>Note</th><th></th></tr><tbody id="expenseRows"></tbody></table></div></div><div class="modal" id="expenseModal"><div class="modalBox"><button class="close" onclick="$('#expenseModal').classList.remove('show')">×</button><h3>New expense</h3><div class="formGrid"><div class="field"><label>Date<input id="e_date" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div><div class="field"><label>Category<select id="e_cat"><option>Materials</option><option>Rent</option><option>Marketing</option><option>Salary</option><option>Transport</option><option>Utilities</option><option>Tax</option><option>Other</option></select></label></div><div class="field"><label>Amount<input id="e_amount" type="number"></label></div><div class="field"><label>Note<input id="e_note"></label></div></div><div class="actionsRow"><button class="btn primary" onclick="Biz.submitExpense()">Save expense</button></div></div></div>`;else if(P==='/app/purchases')c=`<div class="pageTitle"><div><h1>Purchases</h1><p>Record incoming stock and supplier costs.</p></div><button class="btn primary" onclick="$('#purchaseModal').classList.add('show')">+ Purchase</button></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Purchase</th><th>Supplier</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody id="purchaseRows"></tbody></table></div></div><div class="card" style="margin-top:16px"><h3>Suppliers</h3><div class="actionsRow"><button class="btn" onclick="$('#supplierModal').classList.add('show')">+ Supplier</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>GSTIN</th></tr></thead><tbody id="supplierRows"></tbody></table></div></div><div class="modal" id="purchaseModal"><div class="modalBox"><button class="close" onclick="$('#purchaseModal').classList.remove('show')">×</button><h3>New purchase</h3><div class="formGrid"><div class="field"><label>Purchase no<input id="pu_no" value="PUR-${Date.now().toString().slice(-6)}"></label></div><div class="field"><label>Date<input id="pu_date" type="date"></label></div><div class="field"><label>Supplier<input id="pu_supplier"></label></div><div class="field"><label>GST rate<input id="pu_gst" type="number" value="18"></label></div><div class="full"><h3>Items</h3><div class="formGrid"><div class="field"><label>Product ID<input id="pu_productId" placeholder="Optional product ID"></label></div><div class="field"><label>Description<input id="pu_item"></label></div><div class="field"><label>Quantity<input id="pu_qty" type="number" value="1"></label></div><div class="field"><label>Rate<input id="pu_rate" type="number"></label></div></div><div class="actionsRow"><button class="btn" onclick="addPurchaseItem()">+ Add item</button></div><div id="pu_items" style="margin-top:12px"></div></div></div><div class="actionsRow"><button class="btn primary" onclick="savePurchase()">Save purchase</button></div></div></div><div class="modal" id="supplierModal"><div class="modalBox"><button class="close" onclick="$('#supplierModal').classList.remove('show')">×</button><h3>New supplier</h3><div class="formGrid"><div class="field"><label>Name<input id="s_name"></label></div><div class="field"><label>Phone<input id="s_phone"></label></div><div class="field"><label>Email<input id="s_email"></label></div><div class="field"><label>GSTIN<input id="s_gstin"></label></div><div class="full field"><label>Address<textarea id="s_address"></textarea></label></div></div><div class="actionsRow"><button class="btn primary" onclick="saveSupplier()">Save supplier</button></div></div></div>`;else if(P==='/app/quotations')c=`<div class="pageTitle"><div><h1>Quotations</h1><p>Quote work before it becomes a sale.</p></div><button class="btn primary" onclick="$('#quoteModal').classList.add('show')">+ Quotation</button></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Quote</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th></th>< let invItems=[];function addInvItem(){const name=$('#inv_item').value.trim(),amount=Number($('#inv_amount').value)||0;if(!name||!amount)return;invItems.push({name,qty:1,rate:amount});$('#inv_item').value='';$('#inv_amount').value='';renderInvItems()}function renderInvItems(){$('#invItems').innerHTML=invItems.map((x,i)=>`<div class="kpiRow"><span>${escapeHtml(x.name)}</span><b>${money(x.rate)}</b><button class="btn sm danger" onclick="invItems.splice(${i},1);renderInvItems()">Remove</button></div>`).join('')||'<div class="empty">No items added.</div>'}
